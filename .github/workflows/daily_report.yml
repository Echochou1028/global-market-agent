name: Global Market Daily Report

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 08:00 自动运行
    # GitHub Actions 使用 UTC
    # 北京时间 = UTC + 8
    - cron: "0 0 * * *"


jobs:

  run-market-agent:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. 获取 GitHub 仓库代码
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. 设置 Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # 3. 安装依赖
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # 4. 检查项目文件
      # ======================================================

      - name: Check project files
        run: |

          echo "=========================================="
          echo "当前目录"
          echo "=========================================="

          pwd


          echo ""
          echo "=========================================="
          echo "项目文件"
          echo "=========================================="

          ls -la


          echo ""
          echo "=========================================="
          echo "src目录"
          echo "=========================================="

          ls -la src


      # ======================================================
      # 5. 检查关键 Python 文件
      # ======================================================

      - name: Check Python files
        run: |

          echo "=========================================="
          echo "检查关键文件"
          echo "=========================================="

          test -f src/main.py
          test -f src/market_data.py
          test -f src/news_data.py
          test -f src/news_scoring.py
          test -f src/ai_news_analyzer.py

          echo "所有关键 Python 文件存在"


      # ======================================================
      # 6. 检查 Python 语法
      # ======================================================

      - name: Check Python syntax
        run: |

          echo "=========================================="
          echo "检查 Python 语法"
          echo "=========================================="

          python -m py_compile src/main.py
          python -m py_compile src/market_data.py
          python -m py_compile src/news_data.py
          python -m py_compile src/news_scoring.py
          python -m py_compile src/ai_news_analyzer.py

          echo "Python 语法检查通过"


      # ======================================================
      # 7. 运行全球市场数据
      # ======================================================

      - name: Run Market Data
        run: |

          echo "=========================================="
          echo "开始获取全球金融市场数据"
          echo "=========================================="

          python src/market_data.py


      # ======================================================
      # 8. 运行新闻分析
      #
      # GROQ_API_KEY 从 GitHub Secrets 注入
      # Python 中通过 os.getenv() 获取
      # ======================================================

      - name: Run News Data
        env:

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |

          echo "=========================================="
          echo "开始获取并分析全球金融市场新闻"
          echo "=========================================="

          python src/news_data.py
