name: Global Market Daily Report

on:
  workflow_dispatch:

  schedule:
    # ============================================================
    # 北京时间 04:00 开始采集，目标 08:00 前完成
    #
    # 原定 07:23（对应UTC 23:23，前一天）实测存在稳定的
    # 1h45m~2h15m排队延迟（而非官方文档说的5-30分钟），
    # 大概率原因：UTC 23:23 离 UTC 00:00 只差37分钟，正好撞上
    # 全球定时任务扎堆UTC零点触发的高峰排队窗口。
    #
    # 04:00（UTC 20:00，前一天）离UTC零点有4小时距离，
    # 用来避开这个排队高峰。即便仍有1-2小时延迟，
    # 04:00+2h=06:00，也能稳稳在8点前跑完。
    #
    # 建议：切换后跑1-2周，对比实际开始时间与cron设定时间，
    # 确认延迟是否真的缩短；如果没有明显改善，说明排队高峰
    # 的原因判断有误，需要重新定位。
    #
    # 使用 GitHub Actions 的 timezone 字段直接按北京时间调度，
    # 不需要再手工换算 UTC。
    #
    # 只在周一到周五触发（cron第5段 1-5）——周末不运行。
    # 这跟 news_data.py 里的时间窗口逻辑是配套的：
    # 周二到周五用24小时窗口（上次运行到这次运行正好衔接），
    # 周一用72小时窗口（补上周五运行时间点到周一运行时间点
    # 之间的完整空窗，即周五、周六、周日三天）。
    # 如果这里改成每天运行，news_data.py那边的假设就不成立了，
    # 两边要一起改，不能只改一边。
    #
    # 注意：news_data.py 的窗口判断（get_news_window_hours）用的是
    # "运行时当下的实际星期几"，不是cron设定的触发星期几，
    # 所以这里改触发时间（04:00而非07:23）不影响周一/周二判断——
    # 只要实际开始时间没有因为排队延迟跨过午夜、错位到另一天
    # （目前观察到的延迟量级不会导致这个问题），两边就仍然是
    # 严丝合缝衔接的，不需要额外改动 news_data.py。
    #
    # 注意（无法通过配置消除的平台限制）：
    # GitHub Actions 的 schedule 触发是"尽力而为"，官方不保证
    # 精确到分钟，仍可能有排队延迟。如果 8:00 前
    # 出报告是硬要求，建议：
    #   1. 把内部流程压缩到 15-20 分钟内跑完（见下方 timeout-minutes，
    #      实测目前约15分钟）
    #   2. 保留 workflow_dispatch，调度明显迟到时可以手动补跑
    # ============================================================
    - cron: "0 4 * * 1-5"
      timezone: "Asia/Shanghai"


jobs:

  run-market-agent:

    runs-on: ubuntu-latest

    # 给整个任务设一个硬上限，避免某次运行卡住/限流重试
    # 无限循环，白白消耗免费额度的 Actions 分钟数。
    # 按当前批量+限速的预估耗时（AI分析约10-15分钟）留了余量。
    timeout-minutes: 25

    steps:

      # ======================================================
      # 1. 获取 GitHub 仓库代码
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. 设置 Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # 3. 安装依赖
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # 4. 检查项目文件
      # ======================================================

      - name: Check project files
        run: |

          echo "=========================================="
          echo "当前目录"
          echo "=========================================="

          pwd


          echo ""
          echo "=========================================="
          echo "项目文件"
          echo "=========================================="

          ls -la


          echo ""
          echo "=========================================="
          echo "src目录"
          echo "=========================================="

          ls -la src


      # ======================================================
      # 5. 检查关键 Python 文件
      # ======================================================

      - name: Check Python files
        run: |

          echo "=========================================="
          echo "检查关键文件"
          echo "=========================================="

          test -f src/main.py
          test -f src/market_data.py
          test -f src/news_data.py
          test -f src/news_scoring.py
          test -f src/ai_news_analyzer.py

          echo "所有关键 Python 文件存在"


      # ======================================================
      # 6. 检查 Python 语法
      # ======================================================

      - name: Check Python syntax
        run: |

          echo "=========================================="
          echo "检查 Python 语法"
          echo "=========================================="

          python -m py_compile src/main.py
          python -m py_compile src/market_data.py
          python -m py_compile src/news_data.py
          python -m py_compile src/news_scoring.py
          python -m py_compile src/ai_news_analyzer.py

          echo "Python 语法检查通过"


      # ======================================================
      # 7. 运行全球市场数据
      # ======================================================

      - name: Run Market Data
        run: |

          echo "=========================================="
          echo "开始获取全球金融市场数据"
          echo "=========================================="

          python src/market_data.py


      # ======================================================
      # 8. 运行新闻分析 + 发送邮件
      #
      # GROQ_API_KEY 从 GitHub Secrets 注入，Python 中通过
      # os.getenv() 获取。
      #
      # 邮件发送在 news_data.py 的 __main__ 里同一次运行内完成，
      # 复用已经算好的 news 结果，不会重新触发一遍AI分析。
      #
      # 需要在仓库 Settings → Secrets and variables → Actions
      # 里配置以下三个 Secrets（同一个Gmail邮箱收发）：
      #   SMTP_USERNAME  = jessychou1028@gmail.com
      #   SMTP_PASSWORD  = Gmail的"应用专用密码"（16位，不是
      #                    登录密码——需要先在Google账号开启
      #                    两步验证，再去"应用专用密码"页面生成）
      #   SMTP_TO        = jessychou1028@gmail.com（跟
      #                    SMTP_USERNAME 一样，自己发给自己）
      # ======================================================

      - name: Run News Data
        env:

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}

        run: |

          echo "=========================================="
          echo "开始获取并分析全球金融市场新闻"
          echo "=========================================="

          python src/news_data.py
