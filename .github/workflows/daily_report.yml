name: Global Market Daily Report

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 08:00 自动运行
    # GitHub Actions 使用 UTC 时间，北京时间 = UTC+8
    - cron: "0 0 * * *"

jobs:
  run-market-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check source files
        run: |
          echo "当前目录："
          pwd
          echo "src目录内容："
          ls -la src
          
      - name: Verify news_data.py
        run: |
          echo "当前 Commit："
          git rev-parse HEAD
          echo "news_data.py 第660-670行："
          nl -ba src/news_data.py | sed -n '660,670p'

      - name: Run Market Agent
        run: |
          python src/market_data.py
      - name: Run news data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/news_data.py
