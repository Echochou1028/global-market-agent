name: Global Market Daily Report

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 08:00 自动运行
    # GitHub Actions 使用 UTC 时间，北京时间 = UTC+8
    - cron: "0 0 * * *"

jobs:
  run-market-agent:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 拉取代码
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. 设置 Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. 安装依赖
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. 检查源代码
      # ============================================================
      - name: Check source files
        run: |
          echo "当前目录："
          pwd

          echo "src目录内容："
          ls -la src

      # ============================================================
      # 5. 检查当前 Commit
      # ============================================================
      - name: Verify source version
        run: |
          echo "当前 Commit："
          git rev-parse HEAD

          echo "当前分支："
          git branch --show-current

      # ============================================================
      # 6. 运行全球金融市场日报 Agent
      #
      # Groq API Key 从 GitHub Secrets 注入
      # Python 通过 GROQ_API_KEY 获取
      # ============================================================
      - name: Run Market Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/main.py
