name: Global Market Daily Report

on:
  # ============================================================
  # 触发方式：外部定时器（cron-job.org）每个工作日北京时间 07:15
  # 调用 GitHub API 的 workflow_dispatch 触发本工作流。
  #
  # 为什么不用 GitHub 自带的 schedule：
  # schedule 是"尽力而为"，实测排队延迟 3.7~6.7 小时（07:42~10:44
  # 才开始），甚至整次被丢弃，无法保证 8 点前出报告。
  # workflow_dispatch 基本不排队，运行约 15 分钟，07:30 左右完成。
  #
  # 注意：
  # 1. 这里不要再加 schedule，否则会和外部触发各发一封邮件。
  # 2. 只在周一到周五触发（在 cron-job.org 里设置）。
  #    news_data.py 用"运行时的实际星期几"决定窗口：
  #    周二到周五 24 小时，周一 72 小时，与此配套。
  # 3. 手动点 Run workflow 补跑同样可用。
  # ============================================================
  workflow_dispatch:


jobs:

  run-market-agent:

    runs-on: ubuntu-latest

    # 给整个任务设一个硬上限，避免某次运行卡住/限流重试
    # 无限循环，白白消耗免费额度的 Actions 分钟数。
    # 按当前批量+限速的预估耗时（AI分析约10-15分钟）留了余量。
    timeout-minutes: 25

    steps:

      # ======================================================
      # 1. 获取 GitHub 仓库代码
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. 设置 Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # 3. 安装依赖
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # 4. 检查项目文件
      # ======================================================

      - name: Check project files
        run: |

          echo "=========================================="
          echo "当前目录"
          echo "=========================================="

          pwd


          echo ""
          echo "=========================================="
          echo "项目文件"
          echo "=========================================="

          ls -la


          echo ""
          echo "=========================================="
          echo "src目录"
          echo "=========================================="

          ls -la src


      # ======================================================
      # 5. 检查关键 Python 文件
      # ======================================================

      - name: Check Python files
        run: |

          echo "=========================================="
          echo "检查关键文件"
          echo "=========================================="

          test -f src/main.py
          test -f src/market_data.py
          test -f src/news_data.py
          test -f src/news_scoring.py
          test -f src/ai_news_analyzer.py

          echo "所有关键 Python 文件存在"


      # ======================================================
      # 6. 检查 Python 语法
      # ======================================================

      - name: Check Python syntax
        run: |

          echo "=========================================="
          echo "检查 Python 语法"
          echo "=========================================="

          python -m py_compile src/main.py
          python -m py_compile src/market_data.py
          python -m py_compile src/news_data.py
          python -m py_compile src/news_scoring.py
          python -m py_compile src/ai_news_analyzer.py

          echo "Python 语法检查通过"


      # ======================================================
      # 7. 运行全球市场数据
      # ======================================================

      - name: Run Market Data
        run: |

          echo "=========================================="
          echo "开始获取全球金融市场数据"
          echo "=========================================="

          python src/market_data.py


      # ======================================================
      # 8. 运行新闻分析 + 发送邮件
      #
      # GROQ_API_KEY 从 GitHub Secrets 注入，Python 中通过
      # os.getenv() 获取。
      #
      # 邮件发送在 news_data.py 的 __main__ 里同一次运行内完成，
      # 复用已经算好的 news 结果，不会重新触发一遍AI分析。
      #
      # 需要在仓库 Settings → Secrets and variables → Actions
      # 里配置以下三个 Secrets（同一个Gmail邮箱收发）：
      #   SMTP_USERNAME  = jessychou1028@gmail.com
      #   SMTP_PASSWORD  = Gmail的"应用专用密码"（16位，不是
      #                    登录密码——需要先在Google账号开启
      #                    两步验证，再去"应用专用密码"页面生成）
      #   SMTP_TO        = jessychou1028@gmail.com（跟
      #                    SMTP_USERNAME 一样，自己发给自己）
      # ======================================================

      - name: Run News Data
        env:

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}

        run: |

          echo "=========================================="
          echo "开始获取并分析全球金融市场新闻"
          echo "=========================================="

          python src/news_data.py
