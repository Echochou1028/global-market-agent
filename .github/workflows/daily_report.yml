name: Global Market Daily Report

on:
  workflow_dispatch:

  schedule:
    # ============================================================
    # 北京时间 07:23 开始采集，目标 08:00 前完成
    #
    # 特意错开 07:30 这种整点/半点——GitHub 官方文档明确说
    # 高峰时段（尤其整点/半点前后）排队延迟更常见，错峰几分钟
    # 是目前唯一能主动降低这个风险的手段。
    #
    # 使用 GitHub Actions 的 timezone 字段直接按北京时间调度，
    # 不需要再手工换算 UTC。
    #
    # 注意（无法通过配置消除的平台限制）：
    # GitHub Actions 的 schedule 触发是"尽力而为"，官方不保证
    # 精确到分钟，仍可能有 5-30 分钟排队延迟。如果 8:00 前
    # 出报告是硬要求，建议：
    #   1. 把内部流程压缩到 15-20 分钟内跑完（见下方 timeout-minutes）
    #   2. 保留 workflow_dispatch，调度明显迟到时可以手动补跑
    # ============================================================
    - cron: "23 7 * * *"
      timezone: "Asia/Shanghai"


jobs:

  run-market-agent:

    runs-on: ubuntu-latest

    # 给整个任务设一个硬上限，避免某次运行卡住/限流重试
    # 无限循环，白白消耗免费额度的 Actions 分钟数。
    # 按当前批量+限速的预估耗时（AI分析约10-15分钟）留了余量。
    timeout-minutes: 25

    steps:

      # ======================================================
      # 1. 获取 GitHub 仓库代码
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. 设置 Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # 3. 安装依赖
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # 4. 检查项目文件
      # ======================================================

      - name: Check project files
        run: |

          echo "=========================================="
          echo "当前目录"
          echo "=========================================="

          pwd


          echo ""
          echo "=========================================="
          echo "项目文件"
          echo "=========================================="

          ls -la


          echo ""
          echo "=========================================="
          echo "src目录"
          echo "=========================================="

          ls -la src


      # ======================================================
      # 5. 检查关键 Python 文件
      # ======================================================

      - name: Check Python files
        run: |

          echo "=========================================="
          echo "检查关键文件"
          echo "=========================================="

          test -f src/main.py
          test -f src/market_data.py
          test -f src/news_data.py
          test -f src/news_scoring.py
          test -f src/ai_news_analyzer.py

          echo "所有关键 Python 文件存在"


      # ======================================================
      # 6. 检查 Python 语法
      # ======================================================

      - name: Check Python syntax
        run: |

          echo "=========================================="
          echo "检查 Python 语法"
          echo "=========================================="

          python -m py_compile src/main.py
          python -m py_compile src/market_data.py
          python -m py_compile src/news_data.py
          python -m py_compile src/news_scoring.py
          python -m py_compile src/ai_news_analyzer.py

          echo "Python 语法检查通过"


      # ======================================================
      # 7. 运行全球市场数据
      # ======================================================

      - name: Run Market Data
        run: |

          echo "=========================================="
          echo "开始获取全球金融市场数据"
          echo "=========================================="

          python src/market_data.py


      # ======================================================
      # 8. 运行新闻分析
      #
      # GROQ_API_KEY 从 GitHub Secrets 注入
      # Python 中通过 os.getenv() 获取
      # ======================================================

      - name: Run News Data
        env:

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |

          echo "=========================================="
          echo "开始获取并分析全球金融市场新闻"
          echo "=========================================="

          python src/news_data.py
